name: fourg_alert
description: "4G Alert — прогностический уведомлятель о покрытии 4G в дороге"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.3.4
  http: ^1.2.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/coverage_ua.bin
    - assets/coverage_meta.json
    - assets/coverage_ops.bin
